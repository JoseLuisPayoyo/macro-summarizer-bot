[project]
name = "macrobot"
version = "0.1.0"
description = "Bot de Telegram que resume en español vídeos largos de YouTube sobre macroeconomía"
readme = "README.md"
authors = [
    { name = "Jose Luis", email = "josepayoyo2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "yt-dlp>=2024.8.6",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
macrobot = "macrobot.bot:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations: type hints en todo el código
    "RUF",
]
ignore = [
    "ANN401",  # se permite Any explícito cuando sea necesario
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: hace red (yt-dlp). Se salta salvo que MACROBOT_INTEGRATION=1.",
]
